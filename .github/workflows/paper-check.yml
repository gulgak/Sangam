name: Comprobación cartera experimental (temporal)

# TEMPORAL: solo para verificar la rama antes de fusionar. No publica nada.
on:
  push:
    branches: [claude/radar-paper]
    paths: ["radar/paper.py", "radar/paper_check.py", ".github/workflows/paper-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: radar/requirements.txt
      - run: pip install -r radar/requirements.txt
      - run: python -m pytest radar/tests -q
      - run: python -u -m radar.paper_check
