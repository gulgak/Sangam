name: Backtest del Radar

on:
  workflow_dispatch:
  push:
    # TEMPORAL: ejecución de validación en la rama del backtest. Se elimina antes de fusionar.
    branches: [claude/radar-backtest]
    paths: ["radar/backtest/**", ".github/workflows/backtest.yml"]

permissions:
  contents: write

concurrency:
  group: backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: radar/requirements.txt
      - run: pip install -r radar/requirements.txt
      - name: Tests
        run: python -m pytest radar/tests -q
      - name: Backtest (10 años)
        # La SEC exige un contacto en el User-Agent
        run: python -m radar.backtest.run --user-agent "Sangam radar 277532460+gulgak@users.noreply.github.com"
      - name: Publicar resultado
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar/backtest.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Backtest del Radar: resultados $(TZ=Europe/Madrid date +%F)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
